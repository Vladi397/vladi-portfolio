    <script>
      // Resolve the theme before the first paint. React applies this class from
      // an effect, which runs *after* the browser has painted, so a returning
      // dark-mode visitor would otherwise get one light frame first. Mirrors
      // getInitialTheme() in src/hooks/useTheme.js — light is the default, and
      // only an explicitly saved "dark" opts out.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // Storage blocked — the light default is already correct.
        }
      })();
    </script>
